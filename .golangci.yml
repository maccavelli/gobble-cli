version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - contextcheck
    - copyloopvar
    - depguard
    - fatcontext
    - forbidigo
    - intrange
    - modernize
    - noctx
    - perfsprint
    - sloglint
    - usestdlibvars
    - usetesting
  settings:
    depguard:
      rules:
        logging:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: log$
              desc: use log/slog (0008-MADR D18)
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog (0008-MADR D18)
            - pkg: go.uber.org/zap
              desc: use log/slog (0008-MADR D18)
            - pkg: github.com/rs/zerolog
              desc: use log/slog (0008-MADR D18)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: write through the injected writers or slog (0008-MADR D18)
        - pattern: ^log\..*$
          msg: use log/slog (0008-MADR D18)
        - pattern: ^os\.(Stdout|Stderr|Exit)$
          msg: use the writers and exit code passed to cli.Main (0008-MADR D18)
    sloglint:
      no-mixed-args: true
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys:
        - time
        - level
        - msg
        - source
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - forbidigo
        path: _test\.go
      - linters:
          - forbidigo
        path: cmd/gobble/main\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
