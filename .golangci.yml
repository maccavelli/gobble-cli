version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - contextcheck
    - copyloopvar
    - depguard
    - fatcontext
    - forbidigo
    - intrange
    - modernize
    - noctx
    - perfsprint
    - sloglint
    - usestdlibvars
    - usetesting
  settings:
    depguard:
      rules:
        logging:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: log$
              desc: use log/slog (0008-MADR D18)
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog (0008-MADR D18)
            - pkg: go.uber.org/zap
              desc: use log/slog (0008-MADR D18)
            - pkg: github.com/rs/zerolog
              desc: use log/slog (0008-MADR D18)
        json:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: encoding/json$
              desc: use jsonx, on encoding/json/v2 (0039-MADR D24)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: write through the injected writers or slog (0008-MADR D18)
        - pattern: ^log\..*$
          msg: use log/slog (0008-MADR D18)
        - pattern: ^os\.(Stdout|Stderr|Exit)$
          msg: use the writers and exit code passed to cli.Main (0008-MADR D18)
        - pattern: ^json\.(Marshal|MarshalWrite|MarshalEncode|Unmarshal|UnmarshalRead|UnmarshalDecode)$
          pkg: ^encoding/json/v2$
          msg: encode and decode through jsonx, under its policies (0039-MADR D24)
        - pattern: ^fsx\.SetWalkCeiling$
          pkg: ^github\.com/maccavelli/gobble-cli/internal/fsx$
          msg: only a test binary sets the walk ceiling (0053-MADR D1)
    sloglint:
      no-mixed-args: true
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys:
        - time
        - level
        - msg
        - source
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      # Test files are not checked by these linters.
      - linters:
          - errcheck
          - gosec
          - unparam
          - gocritic
          - goconst
        path: _test\.go
      # Nor by revive, but for confusing-naming. revive compares a package's
      # names in whatever order it reads the files, so a pair split between a
      # test file and another file is reported on either one; dropping it in
      # test files made the verdict depend on that order (0059-MADR). The text
      # is golangci-lint's "<rule>: <message>". It names every rule under
      # revive.rules except confusing-naming, in that order: add or remove a
      # rule in both places together, and never add confusing-naming here
      # (0059-MADR D2). A change of the golangci-lint pin repeats 0059-PLAN
      # P1's plants (0059-MADR D5).
      - linters:
          - revive
        path: _test\.go
        text: '^(atomic|blank-imports|constant-logical-expr|context-as-argument|context-keys-type|dot-imports|empty-block|error-naming|error-return|error-strings|errorf|if-return|increment-decrement|indent-error-flow|range|receiver-naming|redefines-builtin-id|superfluous-else|time-naming|unexported-return|unreachable-code|var-declaration): '
      - linters:
          - forbidigo
        path: _test\.go
      - linters:
          - forbidigo
        path: cmd/gobble/main\.go
      # acpext's tests decode with encoding/json, as an importer of the
      # contract does; acpext cannot import jsonx (0042-PLAN deviation 2).
      - linters:
          - depguard
        path: ^acpext/.*_test\.go$
        text: 0039-MADR D24
      # jsonx is where encoding/json/v2 is called (0039-MADR D24).
      - linters:
          - forbidigo
        path: ^jsonx/
        text: 0039-MADR D24
      # A generator a developer runs, never shipped (0018-PLAN P2 deviation 2).
      - linters:
          - forbidigo
        path: internal/config/genschema/main\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
