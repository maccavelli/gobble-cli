# gobble settings
#
# This file is optional, and so is every key in it. A key that stays
# commented out takes the default shown, and a later gobble may change
# that default. Remove the "# " in front of a key, and of the lines
# it sits under, to set it.
#
# Where settings come from, lowest first:
#   1. gobble's defaults
#   2. this file
#   3. a trusted project's .gobble/settings.yaml
#   4. --set path=value on the command line, for one run
#   5. command-line flags
#
# gobble config get --origin   shows what applies, and where it came from
# gobble config validate       checks this file
# gobble config update         adds the settings a newer gobble knows, as comments
# gobble config schema         prints a JSON Schema for editors
#
# Credentials never go here. They belong in auth.json.

# ---------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------

# The provider gobble uses: gemini, openai, claude, grok, opencode-zen,
# opencode-go, huggingface, kilo or together, with its first model.
# It needs a credential, from any source gobble auth status lists. Empty
# takes the first of them, in that order, with a credential;
# opencode-zen and opencode-go share OPENCODE_API_KEY, so with that
# variable alone only this setting reaches opencode-go.
# defaultProvider: ""

# The model a new session starts with, of defaultProvider's,
# its id exactly, as gobble models list shows it. Empty takes the
# provider's first listed model; without defaultProvider it is
# ignored. --model wins over it for a run.
# defaultModel: ""

# The model that names a new session, as provider/id: gemini, openai,
# claude, grok, opencode-zen, opencode-go, huggingface, kilo or together,
# then the model's id. At the session's first prompt it is sent that
# prompt and asked for a short title, which /name, or a name given at
# the start, outranks. Its provider needs a credential. Empty names no
# session, and makes no extra call. Only this file can set it.
# smallModel: ""

# How long the model service keeps this session's prompt cached, so
# the next request reads it back: none, short or long. On Anthropic's
# models short is five minutes and long an hour; elsewhere both ask
# the same. A write costs more than plain input there (1.25 times, or
# 2 times for long), and a read a tenth. none asks for nothing.
# cacheRetention: short

# ---------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------

# The thinking level a new session starts with: off, minimal, low,
# medium, high, xhigh or max. A resumed session keeps its own, and
# /thinking changes it in a session.
# defaultThinkingLevel: off

# How messages queued while a turn runs reach the model.
#   one-at-a-time   one queued message before each model call
#   all             every queued message at once
# Steering messages arrive mid-turn; follow-ups wait until the turn
# would end. A client can change either for one session.
# steeringMode: one-at-a-time
# followUpMode: one-at-a-time

# The directory session files are kept in, flat, as --session-dir
# keeps them. An absolute path, and ~ is your home. Empty keeps them in
# gobble's data directory, by working directory. Only this file can set
# it, never a project's.
# sessionDir: ""

# ---------------------------------------------------------------------
# Projects
# ---------------------------------------------------------------------

# Whether a project gobble has no saved decision for is trusted: ask,
# always or never. A trusted project's own files load: its
# .gobble/settings.yaml, SYSTEM.md, skills, prompts and personalities.
# With ask, gobble's terminal asks; print mode, gobble acp and gobble
# config cannot, so there it is not trusted. gobble trust and gobble
# untrust save a decision, and --approve or --no-approve decide one
# run. Only this file can set it, never a project's.
# defaultProjectTrust: ask

# ---------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------

# The rules that decide whether a tool call runs, asks first, or is
# refused. Each is allow, ask or deny, then a tool, or a tool and a
# pattern in parentheses. A file tool's pattern matches each path the
# call names, relative to the project, * staying in one directory and
# ** crossing them; a pattern with no slash matches a name anywhere.
# bash's matches the whole command, * matching any text. Any other
# tool, an MCP tool among them, is matched by its name alone, and *
# in a name matches any text. The last rule that matches a call
# decides, a trusted project's rules coming after these; with none, a
# read-only built-in tool runs and every other call asks. Whatever the
# rules say, a write under .git or ~/.ssh, or to gobble's credentials,
# is refused; a write to gobble's or the project's configuration, an
# AGENTS.md or the project's skills asks, as a delete does; and a path
# outside the project asks unless an external_directory rule allows
# it. In print mode, --yes allows once what a rule asks, never these.
# Answering a question "everywhere", or /permissions ... global, adds a
# rule at the end of this list; "for this project" keeps it in
# permissions.json beside this file.
# For example, in place of [] below, one rule a line:
#     - ask: bash(*)
#     - allow: bash(git status*)
#     - deny: read(.env)
#     - allow: external_directory(/tmp/**)
# permissions:
#   rules: []

# ---------------------------------------------------------------------
# Personality
# ---------------------------------------------------------------------

# The personality gobble speaks in: boring (also plain or normal), dry,
# snarky or bombastic, or one of your own, a directory under
# personalities/ beside this file. Dry is the default. Bombastic insults
# you, so gobble asks once before it starts, and sets bombasticAccepted
# when you agree. /personality changes a session's. Only this file can
# set either, never a project's.
# personality: dry
# bombasticAccepted: false

# ---------------------------------------------------------------------
# Compaction
# ---------------------------------------------------------------------

# Whether gobble compacts the conversation on its own. It does before
# a model call once the conversation is over the model's window less
# reserveTokens, or reaches thresholdPercent of the window, or reaches
# thresholdTokens, whichever comes first; 0 turns either threshold
# off. When the model says the conversation is over its window, it is
# compacted and the call is sent once more. keepRecentTokens is the
# recent conversation, in tokens, that a compaction or /compact keeps
# word for word; what comes before it is summarised.
# compaction:
#   enabled: true
#   reserveTokens: 16384
#   keepRecentTokens: 20000
#   thresholdPercent: 0
#   thresholdTokens: 0

# ---------------------------------------------------------------------
# Retry
# ---------------------------------------------------------------------

# Whether a failed model call is retried. The provider retries a rate
# limit, an unavailable service or a dropped connection maxRetries
# times, waiting baseDelayMs, then twice as long each time, up to
# maxDelayMs; a service that asks for a longer wait is not retried, and
# exhausted quota never is. With the network down, a turn waits up to
# offlineWaitMs for it to come back, and 0 does not wait. An empty reply
# is run twice more. Times are in milliseconds.
# retry:
#   enabled: true
#   maxRetries: 3
#   baseDelayMs: 2000
#   maxDelayMs: 60000
#   offlineWaitMs: 300000

# ---------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------

# The bash the bash tool runs. Empty finds one: Git's bash on Windows,
# bash on PATH elsewhere. ~ is your home. Only this file can set it.
# shellPath: ""

# A line run before every bash command, such as "set -euo pipefail".
# Only this file can set it.
# shellCommandPrefix: ""

# Whether bash runs in the ACP client's terminal when the client offers
# one, so the user can watch it there. Off, because a phone client
# shows only "terminal <id>". And the longest timeout, in milliseconds,
# a bash command may ask for: 600000 is 10 minutes. Under gobble acp,
# a project's settings cannot set these; this file and --set can.
# tools:
#   bash:
#     useClientTerminal: false
#     maxTimeoutMs: 600000

# ---------------------------------------------------------------------
# MCP servers (the servers themselves are listed in mcp.json)
# ---------------------------------------------------------------------

# In milliseconds: how long the first prompt waits for servers to
# connect, after which a server still connecting joins a later prompt;
# how long a stdio server has to exit once its input closes; and how
# long after that before it is killed.
# mcp:
#   startupWaitMs: 10000
#   stopGraceMs: 500
#   stopTimeoutMs: 2000

# ---------------------------------------------------------------------
# Editor
# ---------------------------------------------------------------------

# The editor /edit and gobble config edit open. GOBBLE_EDITOR wins over
# it, and it wins over VISUAL and EDITOR. Empty uses VISUAL, then
# EDITOR, then notepad on Windows or vi elsewhere.
# externalEditor: ""
